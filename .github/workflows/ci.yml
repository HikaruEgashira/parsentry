name: Rust CI

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: hikae-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Ensure writable RUSTUP_HOME
        if: runner.environment == 'self-hosted'
        timeout-minutes: 1
        run: |
          # The runner's preinstalled RUSTUP_HOME (e.g. /opt/rustup) may not be
          # writable by the job user; fall back to a per-runner location.
          home="${RUSTUP_HOME:-$HOME/.rustup}"
          if ! { mkdir -p "$home/tmp" && test -w "$home/tmp"; } 2>/dev/null; then
            fallback="${RUNNER_TOOL_CACHE:-$RUNNER_TEMP}/rustup"
            echo "::warning::RUSTUP_HOME $home is not writable; using $fallback"
            mkdir -p "$fallback"
            echo "RUSTUP_HOME=$fallback" >> "$GITHUB_ENV"
          fi

      - name: Install Rust toolchain
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo registry
        timeout-minutes: 5
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-lint-registry-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-registry-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-lint-registry-

      - name: Cache cargo git index
        timeout-minutes: 5
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-lint-git-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-git-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-lint-git-

      - name: Check formatting
        timeout-minutes: 5
        run: cargo fmt --all -- --check

      - name: Run clippy
        timeout-minutes: 10
        run: cargo clippy --all-targets -- -D warnings

  build_and_test:
    name: Build and Test
    runs-on: hikae-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        timeout-minutes: 5
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: Checkout repository
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Ensure writable RUSTUP_HOME
        if: runner.environment == 'self-hosted'
        timeout-minutes: 1
        run: |
          # The runner's preinstalled RUSTUP_HOME (e.g. /opt/rustup) may not be
          # writable by the job user; fall back to a per-runner location.
          home="${RUSTUP_HOME:-$HOME/.rustup}"
          if ! { mkdir -p "$home/tmp" && test -w "$home/tmp"; } 2>/dev/null; then
            fallback="${RUNNER_TOOL_CACHE:-$RUNNER_TEMP}/rustup"
            echo "::warning::RUSTUP_HOME $home is not writable; using $fallback"
            mkdir -p "$fallback"
            echo "RUSTUP_HOME=$fallback" >> "$GITHUB_ENV"
          fi

      - name: Install Rust toolchain
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Cache cargo registry
        timeout-minutes: 5
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-

      - name: Build
        timeout-minutes: 15
        run: cargo build

      - name: Run tests
        timeout-minutes: 10
        run: cargo test
