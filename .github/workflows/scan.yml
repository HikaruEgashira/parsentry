name: Security Scan

on:
  workflow_call:
    inputs:
      version:
        description: 'Parsentry version to use (e.g., v0.15.0). Defaults to latest.'
        required: false
        type: string
        default: 'latest'
    secrets:
      ANTHROPIC_API_KEY:
        description: 'Anthropic API key for Claude analysis'
        required: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: hikae-2vcpu-ubuntu-2404-arm
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 30
    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install parsentry
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          PARSENTRY_VERSION: ${{ inputs.version }}
        run: |
          if [ "${PARSENTRY_VERSION}" = "latest" ]; then
            TAG=$(gh release list --repo HikaruEgashira/parsentry --limit 1 --json tagName --jq '.[0].tagName')
          else
            TAG="${PARSENTRY_VERSION}"
          fi
          echo "Installing parsentry ${TAG}"
          gh release download "${TAG}" \
            --repo HikaruEgashira/parsentry \
            --pattern 'parsentry-aarch64-unknown-linux-gnu.tar.gz' \
            --dir /tmp
          tar xzf /tmp/parsentry-aarch64-unknown-linux-gnu.tar.gz -C /usr/local/bin
          chmod +x /usr/local/bin/parsentry
          parsentry --version

      - name: Cache parsentry scan results
        timeout-minutes: 5
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .parsentry/cache
          key: parsentry-cache-${{ github.base_ref }}-${{ github.sha }}
          restore-keys: |
            parsentry-cache-${{ github.base_ref }}-
            parsentry-cache-

      - name: Get changed source files
        id: diff
        timeout-minutes: 2
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          FILES=$(git diff --name-only --diff-filter=ACMR "origin/${BASE_REF}...HEAD" \
            | grep -E '\.(py|js|ts|jsx|tsx|go|java|rb|rs|c|cpp|cs|php|swift|kt|scala|tf|hcl|yml|yaml|sh|sql|pl|pm|lua)$' \
            | head -200)
          if [ -z "$FILES" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "count=$(echo "$FILES" | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Claude Code
        if: steps.diff.outputs.skip != 'true'
        timeout-minutes: 5
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Run scan
        if: steps.diff.outputs.skip != 'true'
        timeout-minutes: 20
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Restored by the cache step above; unchanged surfaces are skipped
          # by content hash, so only changed surfaces are re-analyzed.
          PARSENTRY_CACHE_DIR: ${{ github.workspace }}/.parsentry/cache
        run: |
          mkdir -p "${PARSENTRY_CACHE_DIR}"
          # Writes are limited to the cache directory and the working tree;
          # Bash is limited to re-running `parsentry scan` (no bypassPermissions).
          SETTINGS=$(mktemp)
          jq -n --arg ws "/${GITHUB_WORKSPACE}" --arg cache "/${PARSENTRY_CACHE_DIR}" '{
            permissions: {
              defaultMode: "default",
              allow: [
                "Read", "Glob", "Grep", "Task",
                "Bash(parsentry scan:*)",
                "Bash(/usr/local/bin/parsentry scan:*)",
                "Bash(PARSENTRY_CACHE_DIR=*parsentry\u0027 scan:*)",
                ("Write(" + $cache + "/**)"), ("Edit(" + $cache + "/**)"),
                ("Write(" + $ws + "/**)"), ("Edit(" + $ws + "/**)")
              ],
              deny: ["WebFetch", "WebSearch"]
            }
          }' > "${SETTINGS}"
          parsentry scan . | claude -p \
            --settings "${SETTINGS}" \
            --permission-mode default \
            --output-format text

      - name: Check SARIF output
        id: sarif
        if: steps.diff.outputs.skip != 'true'
        timeout-minutes: 2
        env:
          PARSENTRY_CACHE_DIR: ${{ github.workspace }}/.parsentry/cache
        run: |
          SARIF=$(find "${PARSENTRY_CACHE_DIR}" -name merged.sarif.json -not -path '*/previous/*' -newer "${GITHUB_WORKSPACE}/.git/HEAD" | head -1)
          if [ -z "${SARIF}" ] || [ ! -s "${SARIF}" ]; then
            echo "::error::merged.sarif.json was not produced by the scan"
            exit 1
          fi
          echo "path=${SARIF}" >> "$GITHUB_OUTPUT"

      - name: Upload SARIF to code scanning
        if: steps.diff.outputs.skip != 'true'
        timeout-minutes: 5
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.sarif.outputs.path }}
          category: parsentry

      - name: Upload reports
        if: always() && steps.diff.outputs.skip != 'true'
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-scan-reports
          path: .parsentry/cache/
          if-no-files-found: ignore
