name: Mutation Testing
on:
  push:
    branches: [main]
    paths:
      - "crates/*/src/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    branches: [main]
    paths:
      - "crates/*/src/**"
  workflow_dispatch:
concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  mutants:
    runs-on: hikae-4vcpu-ubuntu-2404
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        crate:
          - parsentry-core
          - parsentry-utils
          - parsentry-cache
          - parsentry-reports
    steps:
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        timeout-minutes: 5
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
          sudo docker image prune --all --force || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          submodules: true
          persist-credentials: false
          # PRs need the base commit to compute the --in-diff patch
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}
      - name: Ensure writable RUSTUP_HOME
        if: runner.environment == 'self-hosted'
        timeout-minutes: 1
        run: |
          # The runner's preinstalled RUSTUP_HOME (e.g. /opt/rustup) may not be
          # writable by the job user; fall back to a per-runner location.
          home="${RUSTUP_HOME:-$HOME/.rustup}"
          if ! { mkdir -p "$home/tmp" && test -w "$home/tmp"; } 2>/dev/null; then
            fallback="${RUNNER_TOOL_CACHE:-$RUNNER_TEMP}/rustup"
            echo "::warning::RUSTUP_HOME $home is not writable; using $fallback"
            mkdir -p "$fallback"
            echo "RUSTUP_HOME=$fallback" >> "$GITHUB_ENV"
          fi
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        timeout-minutes: 5
        with:
          toolchain: stable
      - if: github.event_name != 'push'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-mutants-${{ matrix.crate }}-${{ github.sha }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-mutants-${{ matrix.crate }}-
            ${{ runner.os }}-mutants-
      - name: Install cargo-mutants
        timeout-minutes: 5
        run: which cargo-mutants || cargo install cargo-mutants --locked
      - name: Run mutation testing on changed lines of ${{ matrix.crate }}
        # PRs mutate only the diff so new code must land with mutant-killing tests
        if: github.event_name == 'pull_request'
        timeout-minutes: 15
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff "$BASE_SHA"...HEAD > pr.diff
          cargo mutants -p ${{ matrix.crate }} --in-diff pr.diff --timeout 60 --output mutants.out --in-place --config mutants.toml -- --lib
      - name: Run mutation testing on ${{ matrix.crate }}
        # parsentry-reports measured 188 mutants in ~5m on 4 vCPU (run 42466644625);
        # 6x headroom keeps crate growth a verdict rather than a cancellation. --in-place forbids -j
        if: github.event_name != 'pull_request'
        timeout-minutes: 30
        run: cargo mutants -p ${{ matrix.crate }} --timeout 60 --output mutants.out --in-place --config mutants.toml -- --lib
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 5
        with:
          name: mutation-report-${{ matrix.crate }}
          path: mutants.out/
      - name: Save cache
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-mutants-${{ matrix.crate }}-${{ github.sha }}-${{ hashFiles('**/Cargo.lock') }}
