name: Mutation Testing
on:
  push:
    branches: [main]
    paths:
      - "crates/*/src/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    branches: [main]
    paths:
      - "crates/*/src/**"
  workflow_dispatch:
concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  mutants:
    runs-on: hikae-4vcpu-ubuntu-2404
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        crate:
          - parsentry-core
          - parsentry-utils
          - parsentry-cache
          - parsentry-reports
    steps:
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        timeout-minutes: 5
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
          sudo docker image prune --all --force || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          submodules: true
          persist-credentials: false
          # PRs need the base commit to compute the --in-diff patch. The '0' must be
          # a string: a numeric 0 is falsy, so `&& 0 || 1` always yielded a shallow clone
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        timeout-minutes: 5
        with:
          toolchain: stable
      - if: github.event_name != 'push'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-mutants-${{ matrix.crate }}-${{ github.sha }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-mutants-${{ matrix.crate }}-
            ${{ runner.os }}-mutants-
      - name: Install cargo-mutants
        timeout-minutes: 5
        run: which cargo-mutants || cargo install cargo-mutants --locked
      - name: Run mutation testing on changed lines of ${{ matrix.crate }}
        # PRs mutate only the diff so new code must land with mutant-killing tests
        if: github.event_name == 'pull_request'
        timeout-minutes: 15
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff "$BASE_SHA"...HEAD > pr.diff
          cargo mutants -p ${{ matrix.crate }} --in-diff pr.diff --timeout 60 --output mutants.out --in-place --config mutants.toml -- --lib
      - name: Run mutation testing on ${{ matrix.crate }}
        # parsentry-reports measured 188 mutants in ~5m on 4 vCPU (run 42466644625);
        # 6x headroom keeps crate growth a verdict rather than a cancellation. --in-place forbids -j
        if: github.event_name != 'pull_request'
        timeout-minutes: 30
        run: cargo mutants -p ${{ matrix.crate }} --timeout 60 --output mutants.out --in-place --config mutants.toml -- --lib
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 5
        with:
          name: mutation-report-${{ matrix.crate }}
          path: mutants.out/
      - name: Save cache
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-mutants-${{ matrix.crate }}-${{ github.sha }}-${{ hashFiles('**/Cargo.lock') }}
